
name: Update Icon Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'chungccicon.json'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.svg'
      - '.github/scripts/update_gallery.py'
      - '.github/workflows/update-icon-gallery.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate icon thumbnails
        run: python .github/scripts/update_gallery.py

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update icon gallery"
          file_pattern: README.md
